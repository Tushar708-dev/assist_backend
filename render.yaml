services:
  - type: web
    name: ai-assistant-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: MONGO_URI
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
